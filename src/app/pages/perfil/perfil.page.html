<ion-header>
  <div class="header-wrap">
    <app-top-bar title="SEU PERFIL"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <div class="photo">
      <div class="add-photo tap">
        <ion-icon name="add-outline"></ion-icon>
      </div>
      <span>Adicionar foto</span>
    </div>

    <app-field icon="person-outline" placeholder="Apelido no time" [(value)]="apelido"></app-field>

    <app-eyebrow>POSIÇÃO PRINCIPAL</app-eyebrow>
    <div class="chip-wrap">
      <app-chip *ngFor="let p of posicoes" [active]="posicao === p" (selected)="posicao = p">{{ p }}</app-chip>
    </div>

    <app-eyebrow>PÉ DOMINANTE</app-eyebrow>
    <div class="chip-row">
      <app-chip *ngFor="let p of pes" [active]="pe === p" [grow]="true" (selected)="pe = p">{{ p }}</app-chip>
    </div>

    <app-field icon="clipboard-outline" placeholder="Número da camisa" [(value)]="numeroCamisa"></app-field>

    <div class="cta">
      <app-button icon="checkmark-outline" (pressed)="concluir()">CONCLUIR</app-button>
    </div>
  </div>
</ion-content>
