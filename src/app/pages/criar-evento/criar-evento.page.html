<ion-header>
  <div class="header-wrap">
    <app-top-bar title="NOVO EVENTO" [showBack]="true" (back)="voltar()"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <app-eyebrow>TIPO DE JOGO</app-eyebrow>
    <div class="type-grid">
      <app-type-card
        [active]="interno"
        icon="shuffle-outline"
        title="Contra o próprio time"
        sub="Racha interno · times sorteados"
        (pressed)="selecionarTipo('INTERNO')"
      ></app-type-card>
      <app-type-card
        [active]="!interno"
        icon="trophy-outline"
        title="Contra time de fora"
        sub="Jogo oficial · titulares + reservas"
        (pressed)="selecionarTipo('EXTERNO')"
      ></app-type-card>
    </div>

    <div class="info-wrap">
      <app-info-box>
        <ng-container *ngIf="interno; else externoInfo">
          Racha interno abre mais vagas (sugestão: <b>20</b>) para formar dois times. O sorteio balanceia por posição e nota.
        </ng-container>
        <ng-template #externoInfo>
          Jogo externo abre menos vagas (sugestão: <b>16</b>) — só quem entra na escalação e no banco.
        </ng-template>
      </app-info-box>
    </div>

    <app-field *ngIf="interno" icon="clipboard-outline" placeholder="Título do racha" [(value)]="tituloRacha"></app-field>
    <app-field *ngIf="!interno" icon="trophy-outline" placeholder="Time adversário" [(value)]="adversario"></app-field>

    <app-field icon="location-outline" placeholder="Local" [(value)]="local"></app-field>
    <app-field icon="calendar-outline" placeholder="Data e hora" [(value)]="dataHora"></app-field>
    <app-field icon="notifications-outline" placeholder="Prazo p/ confirmar" [(value)]="prazoConfirmacao"></app-field>

    <div class="vagas-card">
      <span class="label">Vagas</span>
      <span class="bebas value">{{ vagasSugeridas }}</span>
    </div>

    <app-button icon="checkmark-outline" (pressed)="criarEvento()">CRIAR EVENTO</app-button>
  </div>
</ion-content>
