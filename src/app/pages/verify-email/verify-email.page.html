<ion-header>
  <div class="header-wrap">
    <app-top-bar title="CONFIRMAR E-MAIL" [showBack]="true" (back)="goBack()"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <div class="intro">
      <div class="icon-circle">
        <ion-icon name="mail-outline"></ion-icon>
      </div>
      <div class="text">
        Enviamos um código de 6 dígitos para<br />
        <b>{{ email }}</b>
      </div>
    </div>

    <div class="digits">
      <input
        *ngFor="let d of digits; let i = index"
        [value]="d"
        (input)="setDigit(i, $any($event.target).value)"
        inputmode="numeric"
        maxlength="1"
        [class.filled]="d"
      />
    </div>

    <app-button icon="checkmark-outline" (pressed)="confirm()">CONFIRMAR</app-button>

    <div class="resend">
      <ng-container *ngIf="secondsUntilResend > 0; else canResend">
        Reenviar código em <b>{{ timeUntilResend }}</b>
      </ng-container>
      <ng-template #canResend>
        <span class="tap link" (click)="resend()">Reenviar código</span>
      </ng-template>
    </div>
  </div>
</ion-content>
