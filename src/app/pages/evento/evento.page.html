<ion-header>
  <div class="header-wrap">
    <app-top-bar title="DETALHES DO JOGO" [showBack]="true" (back)="voltar()"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <div class="tag">
      <ion-icon name="shuffle-outline"></ion-icon> RACHA INTERNO
    </div>
    <div class="bebas title">RACHA DE SÁBADO</div>
    <div class="meta">
      <span><ion-icon name="calendar-outline"></ion-icon> Sáb · 26 jul · 15h</span>
      <span><ion-icon name="location-outline"></ion-icon> Campo do Zé Pretão</span>
    </div>

    <div class="vagas-card">
      <div class="row">
        <span class="label">Vagas preenchidas</span>
        <span class="bebas value">16<span class="total">/20</span></span>
      </div>
      <div class="bar">
        <div class="fill"></div>
      </div>
    </div>

    <app-button variant="grass" icon="checkmark-outline">VOCÊ CONFIRMOU PRESENÇA</app-button>
    <div class="spacer"></div>
    <div (click)="irParaSorteio()">
      <app-button variant="gold" icon="shuffle-outline">SORTEAR TIMES</app-button>
    </div>

    <app-player-group title="CONFIRMADOS" color="var(--p-grass)" [players]="confirmados"></app-player-group>
    <app-player-group title="DÚVIDA" color="var(--p-gold)" [players]="duvida"></app-player-group>
  </div>
</ion-content>
