<ion-header>
  <div class="header-wrap home-header">
    <div class="left">
      <div class="icon-btn">
        <ion-icon name="menu-outline"></ion-icon>
      </div>
      <div>
        <div class="bebas team-name">UNIÃO DA VILA F.C.</div>
        <div class="role-row"><app-role-badge role="PRESIDENTE"></app-role-badge></div>
      </div>
    </div>
    <div class="bell-wrap">
      <div class="icon-btn">
        <ion-icon name="notifications-outline"></ion-icon>
      </div>
      <span class="dot"></span>
    </div>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body pad-none-top">
    <div class="row-header">
      <app-eyebrow>PRÓXIMO JOGO</app-eyebrow>
      <span class="new-event tap" (click)="irParaCriarEvento()">
        <ion-icon name="add-outline"></ion-icon> Novo evento
      </span>
    </div>

    <div class="match-card tap" (click)="irParaEvento()">
      <div class="glow"></div>
      <div class="match-date">
        <ion-icon name="calendar-outline"></ion-icon>
        <span class="bebas">SÁB · 26 JUL · 15H00</span>
      </div>
      <div class="match-teams">
        <app-team-crest crest="UV" name="União da Vila" [home]="true"></app-team-crest>
        <span class="bebas vs">VS</span>
        <app-team-crest crest="RV" name="Real Várzea"></app-team-crest>
      </div>
      <div class="match-local">
        <ion-icon name="location-outline"></ion-icon> Campo do Zé Pretão
      </div>
      <div class="match-cta">
        <app-button
          [variant]="presencaConfirmada ? 'grass' : 'gold'"
          icon="checkmark-outline"
          (pressed)="alternarPresenca($event)"
        >{{ presencaConfirmada ? 'PRESENÇA CONFIRMADA' : 'CONFIRMAR PRESENÇA' }}</app-button>
      </div>
    </div>

    <div class="avatars-row">
      <div class="stack">
        <div class="stacked" *ngFor="let a of avatares">
          <app-avatar [label]="a" [size]="30"></app-avatar>
        </div>
        <div class="stacked">
          <app-avatar label="+11" [size]="30" variant="grass"></app-avatar>
        </div>
      </div>
      <div class="vagas">
        <span class="bebas count">16</span>
        <span class="total">/20 vagas</span>
      </div>
    </div>

    <div class="tiles">
      <app-tile icon="people-outline" label="Elenco" sub="18 atletas"></app-tile>
      <app-tile icon="star-outline" label="Notas" sub="Avaliar time" (pressed)="irParaNotas()"></app-tile>
      <app-tile icon="checkbox-outline" label="Votação" sub="Craque do jogo" (pressed)="irParaVotacao()"></app-tile>
      <app-tile icon="shuffle-outline" label="Sortear" sub="Times do racha" (pressed)="irParaSorteio()"></app-tile>
    </div>

    <div class="finance-banner tap" (click)="irParaFinanceiro()">
      <div>
        <div class="label">MENSALIDADE</div>
        <div class="value">4 atletas em atraso · R$ 240</div>
      </div>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </div>
  </div>
</ion-content>

<ion-footer>
  <div class="footer-wrap">
    <app-bottom-nav active="Início"></app-bottom-nav>
  </div>
</ion-footer>
