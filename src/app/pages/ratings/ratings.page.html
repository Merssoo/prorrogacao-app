<ion-header>
  <div class="header-wrap">
    <app-top-bar title="NOTAS DO ELENCO" [showBack]="true" (back)="goBack()"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <div class="info-wrap">
      <app-info-box icon="shield-outline" iconColor="#8FB4FF">
        Visível só para <b>presidente, tesoureiro e conselheiros</b>. A média das notas alimenta o sorteio balanceado.
      </app-info-box>
    </div>

    <div class="player-card" *ngFor="let p of players; let i = index">
      <div class="player-top">
        <app-avatar [label]="p.initials" [size]="36"></app-avatar>
        <div class="info">
          <div class="name">{{ p.name }}</div>
          <div class="meta">{{ p.pos }} · média 7.8</div>
        </div>
        <div class="score">
          <div class="bebas value">{{ ratings[i] }}</div>
          <div class="label">sua nota</div>
        </div>
      </div>
      <div class="rating">
        <button
          type="button"
          class="tap"
          *ngFor="let n of ratingScale"
          [class.on]="n <= ratings[i]"
          (click)="setRating(i, n)"
        >{{ n }}</button>
      </div>
    </div>
  </div>
</ion-content>
