<ion-header>
  <div class="header-wrap">
    <app-top-bar title="NOVO EVENTO" [showBack]="true" (back)="goBack()"></app-top-bar>
  </div>
</ion-header>

<ion-content [fullscreen]="true" class="screen-content">
  <div class="body">
    <app-eyebrow>TIPO DE JOGO</app-eyebrow>
    <div class="type-grid">
      <app-type-card
        [active]="isInternal"
        icon="shuffle-outline"
        title="Contra o próprio time"
        sub="Racha interno · times sorteados"
        (pressed)="selectType('INTERNAL')"
      ></app-type-card>
      <app-type-card
        [active]="!isInternal"
        icon="trophy-outline"
        title="Contra time de fora"
        sub="Jogo oficial · titulares + reservas"
        (pressed)="selectType('EXTERNAL')"
      ></app-type-card>
    </div>

    <div class="info-wrap">
      <app-info-box>
        <ng-container *ngIf="isInternal; else externalInfo">
          Racha interno abre mais vagas (sugestão: <b>20</b>) para formar dois times. O sorteio balanceia por posição e nota.
        </ng-container>
        <ng-template #externalInfo>
          Jogo externo abre menos vagas (sugestão: <b>16</b>) — só quem entra na escalação e no banco.
        </ng-template>
      </app-info-box>
    </div>

    <app-field *ngIf="isInternal" icon="clipboard-outline" placeholder="Título do racha" [(value)]="matchTitle"></app-field>
    <app-field *ngIf="!isInternal" icon="trophy-outline" placeholder="Time adversário" [(value)]="opponent"></app-field>

    <app-field icon="location-outline" placeholder="Local" [(value)]="venue"></app-field>
    <app-field icon="calendar-outline" placeholder="Data e hora" [(value)]="dateTime"></app-field>
    <app-field icon="notifications-outline" placeholder="Prazo p/ confirmar" [(value)]="confirmationDeadline"></app-field>

    <div class="spots-card">
      <span class="label">Vagas</span>
      <span class="bebas value">{{ suggestedSpots }}</span>
    </div>

    <app-button icon="checkmark-outline" (pressed)="createEvent()">CRIAR EVENTO</app-button>
  </div>
</ion-content>
