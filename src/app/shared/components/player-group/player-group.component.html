<div class="player-group">
  <div class="header">
    <span class="dot" [style.background]="color"></span>
    <span class="label">{{ title }} · {{ players.length }}</span>
  </div>
  <div class="list">
    <app-player-row
      *ngFor="let p of players"
      [nome]="p.nome"
      [pos]="p.pos"
      [ini]="p.ini"
    ></app-player-row>
  </div>
</div>
