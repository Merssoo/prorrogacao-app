<div class="code-input">
  <input
    *ngFor="let d of digits; let i = index; trackBy: trackByIndex"
    #digitInput
    [value]="d"
    (input)="onDigitInput(i, $event)"
    (keydown)="onDigitKeydown(i, $event)"
    (paste)="onDigitsPaste($event)"
    type="text"
    inputmode="numeric"
    autocomplete="one-time-code"
    pattern="[0-9]*"
    maxlength="1"
    [disabled]="disabled"
    [class.filled]="d"
  />
</div>
