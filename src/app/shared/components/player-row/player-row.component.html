<div class="player-row">
  <app-crest-badge [crestUrl]="photoUrl" crestShape="CIRCLE" [size]="34" [fallbackLabel]="initials" avatarVariant="gold"></app-crest-badge>
  <span class="name">{{ name }}</span>
  <span class="pos">{{ pos }}</span>
  <div class="options-btn tap" *ngIf="showOptions" (click)="optionsTap.emit()">
    <ion-icon name="ellipsis-vertical"></ion-icon>
  </div>
</div>
