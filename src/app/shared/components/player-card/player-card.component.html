<div class="player-card" [class.tapped]="tapped" (click)="onCardTap()">
  <div class="card-inner">
    <div class="card-shine"></div>

    <div class="top-row">
      <div class="side-col">
        <div class="jersey-number" *ngIf="jerseyNumber !== null">{{ jerseyNumber }}</div>
        <div class="position-abbr" *ngIf="positionAbbr">{{ positionAbbr }}</div>
        <div class="side-divider" *ngIf="jerseyNumber !== null || positionAbbr"></div>
        <svg class="flag" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="20" rx="2" fill="#009c3b" />
          <polygon points="14,3 25,10 14,17 3,10" fill="#ffdf00" />
          <circle cx="14" cy="10" r="3.6" fill="#002776" />
        </svg>

        <div class="brand">prorrogação</div>
      </div>

      <div class="photo-area tap" (click)="photoTap.emit()">
        <img *ngIf="photoUrl" [src]="photoUrl" alt="" />
        <div class="photo-placeholder" *ngIf="!photoUrl">
          <ion-icon name="person-outline"></ion-icon>
        </div>
        <div class="photo-uploading" *ngIf="photoUploading">
          <ion-spinner name="crescent"></ion-spinner>
        </div>
        <div class="photo-edit-badge" *ngIf="!photoUploading">
          <ion-icon name="camera-outline"></ion-icon>
        </div>
      </div>
    </div>

    <div class="bottom-area">
      <div class="nickname bebas">{{ nickname || 'SEU APELIDO' }}</div>
      <div class="nickname-divider"></div>

      <div class="stats">
        <div class="stat"><div class="label">ATA</div><div class="value">{{ attackRating }}</div></div>
        <div class="stat"><div class="label">DEF</div><div class="value">{{ defenseRating }}</div></div>
        <div class="stat"><div class="label">FOR</div><div class="value">{{ physicalRating }}</div></div>
        <div class="stat"><div class="label">HAB</div><div class="value">{{ skillRating }}</div></div>
      </div>

      <div class="foot-pill" *ngIf="dominantFoot">{{ dominantFoot }}</div>
    </div>

    <div class="medallion">
      <ion-icon name="football"></ion-icon>
    </div>
  </div>
</div>
